<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kitchen H Colour 360</title>
<meta name="claude:viewport-fit-sides" content="cover">
</head><body><style>
:root{--ink:#f4efe6;--dim:#b9b0a2;--panel:rgba(22,20,18,.78);--line:rgba(255,255,255,.14);--accent:#d8b06a;--bg:#14120f;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13px/1.35 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
#app{position:fixed;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
canvas.drag{cursor:grabbing}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#top{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:flex-start;pointer-events:none}
#title{padding:7px 11px;pointer-events:auto;min-width:0}
#title b{font-weight:600;letter-spacing:.02em}
#title .sub{color:var(--dim);font-size:12px;margin-top:2px}
#now{font-size:12px;margin-top:3px}
#now .sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin:0 3px 0 6px;border:1px solid rgba(255,255,255,.3)}
#tools{margin-left:auto;display:flex;gap:6px;pointer-events:auto}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer;min-height:32px}
button:hover,a.btn:hover{border-color:rgba(255,255,255,.35)}
a.btn{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;min-height:32px;box-sizing:border-box;text-decoration:none;display:inline-flex;align-items:center}
[hidden]{display:none!important}
button:disabled{opacity:.35;cursor:not-allowed}
#bottom{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end}
#pals{display:flex;gap:6px;overflow-x:auto;padding:6px;flex:1;min-width:0;scrollbar-width:thin}
.pal{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:5px 9px 5px 5px;border-radius:9px;border:1px solid transparent;background:transparent;text-align:left;min-height:44px}
.pal .sq{width:34px;height:34px;border-radius:6px;overflow:hidden;display:grid;grid-template-rows:1fr 1fr;border:1px solid rgba(255,255,255,.25);flex:0 0 auto}
.pal .sq i{display:block;background-size:cover}
.pal .t{font-size:11.5px;line-height:1.2;white-space:nowrap}
.pal .t small{color:var(--dim);display:block}
.pal[aria-pressed=true]{border-color:var(--accent);background:rgba(216,176,106,.14)}
.pal.load .sq{outline:2px dashed var(--accent);outline-offset:1px}
#side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#map{position:relative;width:200px;padding:4px;overflow:hidden}
#map img{display:block;width:100%;border-radius:6px;opacity:.92}
#map svg{position:absolute;left:4px;top:4px;width:calc(100% - 8px);height:calc(100% - 8px)}
#map.min img,#map.min svg{display:none}
#map.min{width:auto}
.dot{cursor:pointer}
#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;display:none;align-items:center;gap:10px;pointer-events:none}
#loading.on{display:flex}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--accent);border-radius:50%;animation:s 0.9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.hot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;pointer-events:auto}
.hot .ring{width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:rgba(216,176,106,.55);box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.hot span{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:2px 7px;font-size:11.5px;white-space:nowrap}
#info{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(56px + env(safe-area-inset-top,0px));width:min(360px,calc(100vw - 20px));max-height:calc(100vh - 210px);overflow:auto;padding:10px 12px;display:none}
#info.on{display:block}
#info h3{margin:0 0 6px;font-size:13px}
#info table{border-collapse:collapse;width:100%;font-size:12px}
#info td{border-top:1px solid var(--line);padding:4px 4px;vertical-align:top}
#info .note{color:var(--dim);font-size:11.5px;margin-top:6px}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
#err.on{display:flex}
@media (max-width:640px){#map{width:130px}.pal .t small{display:none}#title .sub{display:none}#tools button.opt{display:none}}
@media (max-height:520px){#map{display:none}}
</style>

  if (p === st.pos || walking || !M.have.includes(`${p}_${st.pal}`)) return;
  walking = true;
  try {
    const d = dirTo(st.pos, p), y0 = st.yaw, dy = ((d.yaw - y0) % 360 + 540) % 360 - 180, f0 = st.fov, p0 = st.pitch, fz = f0 * 0.55;
    const load = textureFor(`${p}_${st.pal}`).catch(() => null);
    await anim(500, k => { st.yaw = y0 + dy * k; st.pitch = p0 + (-4 - p0) * k; st.fov = f0 + (fz - f0) * k; });
    canvas.style.transition = "opacity .2s"; canvas.style.opacity = "0.2";
    await Promise.all([load, new Promise(r => setTimeout(r, 200))]);
    await show(p, st.pal);
    canvas.style.opacity = "1";

}
function mark(pal, on) { const b = document.querySelector(`.pal[data-p="${pal}"]`); if (b) b.classList.toggle("load", on); }
let preloading = false;
async function preloadNext() {                         // fetch the other files in the background, current position first
  if (preloading) return; preloading = true;
  const order = [st.pos, ...Object.keys(M.positions).filter(p => p !== st.pos)];
  for (const p of order) for (const pal of Object.keys(M.palettes)) {
    const k = `${p}_${pal}`;
    if (M.have.includes(k) && !loaded[k]) { try { await fetchPano(k); } catch (e) {} }
  }
  preloading = false;
}
function labels() {
  const P = M.palettes[st.pal], pos = M.positions[st.pos];
  $("posname").textContent = "· " + pos.name;
  $("now").innerHTML = `Showing <b>${st.pal}</b> <span class="sw" style="background:${P.upHex}"></span>upper ${P.up} · <span class="sw" style="${swStyle(P,'low')}"></span>lower + tall ${P.low}`;
  document.querySelectorAll(".pal").forEach(b => b.setAttribute("aria-pressed", b.dataset.p === st.pal ? "true" : "false"));
  $("prev").disabled = !st.prevPal;
  $("prev").textContent = st.prevPal ? `⇄ ${st.prevPal}` : "⇄ Previous";
  renderInfo();
}
const swStyle = (P, r) => r === "low" && P.lowImg ? `background-image:url(${P.lowImg});background-size:cover` : `background:${r === "low" ? P.lowHex : P.upHex}`;
// ---------- palette bar ----------
for (const [code, P] of Object.entries(M.palettes)) {
  const b = document.createElement("button"); b.className = "pal"; b.dataset.p = code;
  const ok = Object.keys(M.positions).every(p => M.have.includes(`${p}_${code}`));
  b.innerHTML = `<span class="sq"><i style="background:${P.upHex}"></i><i style="${swStyle(P,'low')}"></i></span><span class="t"><b>${code}</b> ${P.up}<small>${P.low}${ok ? "" : " · not rendered yet"}</small></span>`;
  b.title = `${code}: upper ${P.up} / lower + tall ${P.low}`;
  if (!M.have.includes(`${st.pos}_${code}`) && !Object.keys(M.positions).some(p => M.have.includes(`${p}_${code}`))) b.disabled = true;
  b.onclick = () => show(st.pos, code);

$("prev").onclick = () => st.prevPal && show(st.pos, st.prevPal);
// ---------- hotspots + map ----------
const D2R = Math.PI / 180;
function dirTo(from, to) {      // plan points in PDF pt: image centre = -y, right = +x
  const a = M.positions[from].pt, b = M.positions[to].pt, dx = b[0] - a[0], dy = b[1] - a[1];
  const dist = Math.hypot(dx, dy) * M.inPerPt;
  return {yaw: Math.atan2(dx, -dy) / D2R, pitch: -Math.atan2(M.positions[from].z || M.eye, dist) / D2R};
}
function project(yaw, pitch, W, H, tx, ty) {
  const ly = (yaw - st.yaw) * D2R, lp = pitch * D2R;
  const ex = Math.cos(lp) * Math.sin(ly), ey = Math.sin(lp), ez = Math.cos(lp) * Math.cos(ly);
  const cp = Math.cos(st.pitch * D2R), sp = Math.sin(st.pitch * D2R);
  const dy = ey * cp - ez * sp, dz = ey * sp + ez * cp;  // inverse pitch
  if (dz <= 0.05) return null;
  return [W / 2 + (ex / dz) / tx * W / 2, H / 2 - (dy / dz) / ty * H / 2];

function placeHots(W, H, tx, ty) {
  const box = $("hots"); box.innerHTML = "";
  for (const p of Object.keys(M.positions)) {
    if (p === st.pos) continue;
    if (M.positions[st.pos].links && !M.positions[st.pos].links.includes(p)) continue;
    if (!M.have.includes(`${p}_${st.pal}`)) continue;                                   // not rendered yet   // whole house: only reachable neighbours
    const d = dirTo(st.pos, p), s = project(d.yaw, d.pitch, W, H, tx, ty);
    if (!s || s[0] < -40 || s[0] > W + 40 || s[1] < 0 || s[1] > H) continue;
    const e = document.createElement("div"); e.className = "hot"; e.style.left = s[0] + "px"; e.style.top = s[1] + "px";
    e.innerHTML = `<div class="ring"></div><span>${M.positions[p].name}</span>`;
    e.onclick = ev => { ev.stopPropagation(); walkTo(p); };

$("mapimg").src = M.map.img;
function drawMap() {
  const svg = $("mapsvg"); const [W, H] = M.map.size;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  let s = "";
  const pp = pt => [(M.map.ox + (pt[0] - M.map.cx) * M.map.s) / 2, (M.map.oy + (pt[1] - M.map.cy) * M.map.s) / 2];
  const [x0, y0] = pp(M.positions[st.pos].pt);
  const half = st.fov * (canvas.clientWidth / canvas.clientHeight) / 2;   // approx horizontal half-angle shown
  const h2 = Math.min(80, Math.atan(Math.tan(st.fov * D2R / 2) * canvas.clientWidth / canvas.clientHeight) / D2R);
  const r = 120, a1 = (st.yaw - h2) * D2R, a2 = (st.yaw + h2) * D2R;
  s += `<path d="M${x0},${y0} L${x0 + r * Math.sin(a1)},${y0 - r * Math.cos(a1)} A${r},${r} 0 0 1 ${x0 + r * Math.sin(a2)},${y0 - r * Math.cos(a2)} Z" fill="rgba(216,176,106,.35)" stroke="#d8b06a" stroke-width="2"/>`;
  for (const [k, P] of Object.entries(M.positions)) {
    const [x, y] = pp(P.pt);
    s += `<g class="dot" data-k="${k}"><circle cx="${x}" cy="${y}" r="${k === st.pos ? 15 : 12}" fill="${k === st.pos ? "#d8b06a" : "#fff"}" stroke="#222" stroke-width="3"/><text x="${x}" y="${y + 5}" font-size="15" text-anchor="middle" fill="#222" font-weight="700">${P.short}</text></g>`;
  }
  svg.innerHTML = s;
  svg.querySelectorAll(".dot").forEach(g => g.onclick = () => walkTo(g.dataset.k));
}
$("map").ondblclick = () => $("map").classList.toggle("min");
// ---------- info panel ----------
function renderInfo() {
  const P = M.palettes[st.pal];
  const rows = (P.finish || []).map(f => `<tr><td>${f[0]}</td><td>${f[1]}</td></tr>`).join("");
  $("info").innerHTML = `<h3>${st.pal}: ${P.up} uppers · ${P.low} lowers + tall</h3>
  <table><tr><td>Uppers + hood</td><td>${P.up} <span style="color:var(--dim)">(render ${P.upHex})</span></td></tr>
  <tr><td>Lowers + tall units</td><td>${P.low} <span style="color:var(--dim)">(render ${P.lowImg ? "woodgrain texture" : P.lowHex})</span></td></tr>${rows}
  <tr><td>Hardware</td><td>${M.hardware}</td></tr></table>
  <div class="note">${M.note}</div>`;
}
$("ib").onclick = () => $("info").classList.toggle("on");
// ---------- input: drag, wheel, pinch, keys ----------
const ptrs = new Map(); let pinch0 = null;
canvas.addEventListener("pointerdown", e => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); canvas.classList.add("drag"); if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = [Math.hypot(a[0] - b[0], a[1] - b[1]), st.fov]; } });
canvas.addEventListener("pointermove", e => {

  const [px, py] = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 2 && pinch0) { const [a, b] = [...ptrs.values()]; zoomTo(pinch0[1] * pinch0[0] / Math.max(10, Math.hypot(a[0] - b[0], a[1] - b[1]))); return; }
  const k = st.fov / canvas.clientHeight;
  st.yaw -= (e.clientX - px) * k; st.pitch = Math.max(-89, Math.min(89, st.pitch + (e.clientY - py) * k)); req();
});
const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = null; if (!ptrs.size) canvas.classList.remove("drag"); };
canvas.addEventListener("pointerup", up); canvas.addEventListener("pointercancel", up);
canvas.addEventListener("wheel", e => { e.preventDefault(); zoomTo(st.fov * Math.exp(e.deltaY * 0.001)); }, {passive: false});
function zoomTo(f) { st.fov = Math.max(25, Math.min(110, f)); req(); }
$("zin").onclick = () => zoomTo(st.fov / 1.2); $("zout").onclick = () => zoomTo(st.fov * 1.2);
window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") st.yaw -= 5; else if (e.key === "ArrowRight") st.yaw += 5;
  else if (e.key === "ArrowUp") st.pitch = Math.min(89, st.pitch + 5); else if (e.key === "ArrowDown") st.pitch = Math.max(-89, st.pitch - 5);

$("fs").onclick = async () => { try { if (document.fullscreenElement) await document.exitFullscreen(); else await $("app").requestFullscreen(); } catch (e) { $("fs").disabled = true; } };
window.addEventListener("resize", req);
if (location.protocol !== "file:") fetch("stills.html", {method: "HEAD"}).then(r => { if (r.ok) $("photos").hidden = false; }).catch(() => {});   // photo page exists only on the shared site
if (M.title) { $("ttl").textContent = M.title; if (!M.title.includes("Layout H")) document.title = M.title.split(" · ").slice(0, 2).join(" "); }

if (gl) { requestAnimationFrame(frame); show(st.pos, st.pal); }
