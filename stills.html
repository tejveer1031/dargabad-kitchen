<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitchen H Photos</title>
<style>
:root{--ink:#f4efe6;--dim:#b9b0a2;--bg:#14120f;--card:#1f1c18;--line:rgba(255,255,255,.12);--accent:#d8b06a;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
header{max-width:1300px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline}
h1{font-size:20px;margin:0;font-weight:600} header p{margin:0;color:var(--dim)}
a{color:var(--accent)} .back{margin-left:auto;text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:6px 12px}
section{max-width:1300px;margin:0 auto 22px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
h2{font-size:16px;margin:0 0 10px;font-weight:600;display:flex;gap:10px;align-items:center}
h2 span{background:var(--accent);color:#14120f;border-radius:6px;padding:0 8px;font-size:13px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px} @media (max-width:720px){.pair{grid-template-columns:1fr}}
figure{margin:0;min-width:0} img{width:100%;height:auto;display:block;border-radius:8px}
figcaption{color:var(--dim);font-size:12.5px;margin-top:4px}
.wait{aspect-ratio:16/9;display:grid;place-items:center;border:1px dashed var(--line);border-radius:8px;color:var(--dim)}
.note{margin:10px 2px 0;color:var(--ink);font-size:14px}
</style></head><body>
